services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - fastapi-starter-kit

  redis:
    image: redis/redis-stack:7.2.0-v19
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "${REDIS_INSIGHT_PORT:-8001}:8001"
    environment:
      REDIS_ARGS: "--appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - fastapi-starter-kit

networks:
  fastapi-starter-kit:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
